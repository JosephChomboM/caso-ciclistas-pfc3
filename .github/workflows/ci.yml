name: CI y seguridad
on:
  push:
    branches: [main, test, 'joseph/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend y PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ciclolima_test
          POSTGRES_USER: ciclolima
          POSTGRES_PASSWORD: ci-temporary-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ciclolima" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ciclolima:ci-temporary-password@localhost:5432/ciclolima_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          version: '0.13.5'
      - run: uv sync --frozen
      - name: Crear secreto efímero de prueba
        run: python -c 'import secrets,os; open(os.environ["GITHUB_ENV"],"a").write("JWT_SECRET="+secrets.token_hex(32)+"\n")'
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrar y probar con PostgreSQL real
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.cli seed-demo
          uv run python -m scripts.postgres_smoke
  frontend:
    name: Frontend build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  dependencies:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          version: '0.13.5'
      - run: uv sync --frozen && uv run pip-audit
        working-directory: backend
  sast:
    name: SAST CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
  container:
    name: Build imagen backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t ciclolima-api:ci backend
  deploy:
    name: Desplegar en Render
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    needs: [backend, frontend, dependencies, sast, container]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    env:
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Validar configuración del ambiente
        run: |
          for name in API_DEPLOY_HOOK WEB_DEPLOY_HOOK API_URL WEB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name en el environment de GitHub. No se acreditó despliegue."
              exit 1
            fi
          done
      - name: Solicitar despliegue
        run: |
          curl --fail --silent --show-error --request POST "$API_DEPLOY_HOOK" --output /dev/null
          curl --fail --silent --show-error --request POST "$WEB_DEPLOY_HOOK" --output /dev/null
      - name: Verificar disponibilidad
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent "$API_URL/ready" | jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha' > /dev/null && curl --fail --silent "$WEB_URL/version.json" | jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha' > /dev/null; then
              echo "API y web disponibles con el commit esperado."
              exit 0
            fi
            sleep 15
          done
          exit 1
