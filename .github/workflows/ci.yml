name: CI y seguridad
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend y PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ciclolima_test
          POSTGRES_USER: ciclolima
          POSTGRES_PASSWORD: ci-temporary-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ciclolima" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ciclolima:ci-temporary-password@localhost:5432/ciclolima_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          version: '0.13.5'
      - run: uv sync --frozen
      - name: Crear secreto efímero de prueba
        run: python -c 'import secrets,os; open(os.environ["GITHUB_ENV"],"a").write("JWT_SECRET="+secrets.token_hex(32)+"\n")'
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrar y probar con PostgreSQL real
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.cli seed-demo
          uv run python -m scripts.postgres_smoke
  frontend:
    name: Frontend build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  dependencies:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          version: '0.13.5'
      - run: uv sync --frozen && uv run pip-audit
        working-directory: backend
  sast:
    name: SAST CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
  container:
    name: Build imagen backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t ciclolima-api:ci backend
  security:
    name: Seguridad
    if: ${{ !cancelled() }}
    needs: [dependencies, sast, container]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar los controles requeridos
        env:
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SAST: ${{ needs.sast.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          for name in DEPENDENCIES SAST CONTAINER; do
            if [ "${!name}" != success ]; then
              echo "::error::$name no pasó. No se permite desplegar."
              exit 1
            fi
          done
  deploy-stage:
    name: Deploy a stage
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.backend.result == 'success' && needs.frontend.result == 'success' &&
          needs.security.result == 'success' }}
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    environment: stage
    env:
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .github/scripts/deploy.sh
  deploy-production:
    name: Deploy a producción
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-stage.result == 'success' }}
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: production
    env:
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .github/scripts/deploy.sh
