services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ciclolima
      POSTGRES_USER: ciclolima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu entorno}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciclolima"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
